name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git make clang perl dpkg wget xz-utils
    
    - name: Install ldid
      run: |
        wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5/ldid_linux_x86_64 -O ldid
        chmod +x ldid
        sudo mv ldid /usr/local/bin/ldid
    
    - name: Clone Theos
      run: |
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        sudo chmod -R 755 /opt/theos
    
    - name: Download SDK
      run: |
        sudo mkdir -p /opt/theos/sdks
        cd /opt/theos/sdks
        sudo wget https://github.com/theos/sdks/releases/download/14.5/iPhoneOS14.5.sdk.tar.xz
        sudo tar -xf iPhoneOS14.5.sdk.tar.xz
    
    - name: Build Tweak
      run: |
        export THEOS=/opt/theos
        make package
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HDangDynamic
        path: packages/*.deb
