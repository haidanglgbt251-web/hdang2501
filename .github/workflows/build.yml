name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Install Dependencies
      run: |
        brew install ldid dpkg
    
    - name: Clone Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git /opt/theos
        sudo chmod -R 755 /opt/theos
    
    - name: Download SDK
      run: |
        mkdir -p /opt/theos/sdks
        cd /opt/theos/sdks
        wget https://github.com/xybp888/iOS-SDKs/releases/download/iOS-14.5-SDK/iPhoneOS14.5.sdk.tar.xz
        tar -xf iPhoneOS14.5.sdk.tar.xz
        ls -la
    
    - name: Build Tweak
      run: |
        export THEOS=/opt/theos
        export PATH=$PATH:/opt/theos/bin
        make package
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HDangDynamic
        path: packages/*.deb
