name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Install Dependencies
      run: |
        brew install ldid dpkg
    
    - name: Clone Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
    
    - name: Download SDK (clone repo)
      run: |
        mkdir -p $HOME/theos/sdks
        cd $HOME/theos/sdks
        git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git
        # Tự động tìm SDK phù hợp
        if [ -d "iOS-SDKs/iPhoneOS14.5.sdk" ]; then
          cp -r iOS-SDKs/iPhoneOS14.5.sdk .
        elif [ -d "iOS-SDKs/iPhoneOS15.0.sdk" ]; then
          cp -r iOS-SDKs/iPhoneOS15.0.sdk .
        elif [ -d "iOS-SDKs/iPhoneOS15.5.sdk" ]; then
          cp -r iOS-SDKs/iPhoneOS15.5.sdk .
        else
          echo "Danh sách SDK có sẵn:"
          ls iOS-SDKs/
          exit 1
        fi
        rm -rf iOS-SDKs
        ls -la
    
    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$PATH:$THEOS/bin
        make package
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HDangDynamic
        path: packages/*.deb
